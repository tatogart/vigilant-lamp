<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>CodeClaw — офлайн код-ассистент</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦞</text></svg>">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d;
    --text:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --user:#1f6feb;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; overscroll-behavior:none;
  }
  header{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    border-bottom:1px solid var(--border); background:var(--panel);
    position:sticky; top:0; z-index:5;
  }
  header h1{font-size:16px; margin:0; flex:1;}
  #status{font-size:12px; color:var(--dim); max-width:45%; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap;}
  #chat{flex:1; overflow-y:auto; padding:14px; display:flex;
    flex-direction:column; gap:12px;}
  .msg{max-width:92%; padding:10px 13px; border-radius:14px;
    white-space:pre-wrap; word-break:break-word;}
  .msg.user{align-self:flex-end; background:var(--user); color:#fff;
    border-bottom-right-radius:4px;}
  .msg.assistant{align-self:flex-start; background:var(--panel);
    border:1px solid var(--border); border-bottom-left-radius:4px;}
  .msg.assistant.streaming::after{content:"▌"; animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:0;}}
  pre{position:relative; background:#010409; border:1px solid var(--border);
    border-radius:10px; padding:12px; margin:10px 0; overflow-x:auto;}
  pre code{font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:#a5d6ff; white-space:pre;}
  .copy-btn{position:absolute; top:6px; right:6px; font-size:11px;
    background:var(--panel); color:var(--dim); border:1px solid var(--border);
    border-radius:7px; padding:3px 9px; cursor:pointer;}
  .copy-btn:active{background:var(--user); color:#fff;}
  #composer{display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border); background:var(--panel);}
  #input{flex:1; resize:none; max-height:120px; min-height:42px;
    background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:12px; padding:10px 12px; font:inherit;}
  #send{background:var(--user); color:#fff; border:0; border-radius:12px;
    padding:0 18px; font-weight:600; cursor:pointer;}
  #send:disabled{opacity:.4;}
  #overlay{position:fixed; inset:0; background:var(--bg); z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:24px; text-align:center;}
  #overlay.hidden{display:none;}
  #bar{width:min(320px,80%); height:8px; background:var(--panel);
    border:1px solid var(--border); border-radius:99px; overflow:hidden;}
  #fill{height:100%; width:0%; background:var(--accent); transition:width .2s;}
  #install-btn{display:none; background:var(--accent); color:#0d1117;
    border:0; border-radius:10px; padding:9px 18px; font-weight:700; cursor:pointer;}
  .hint{font-size:12px; color:var(--dim); max-width:420px;}
</style>
</head>
<body>

<div id="overlay">
  <div style="font-size:52px">🦞</div>
  <h2 style="margin:0">CodeClaw</h2>
  <div class="hint">Код-ассистент, работающий полностью в браузере.
    Модель скачивается один раз (~1 ГБ) и дальше работает офлайн.</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="load-text">Подготовка…</div>
  <button id="install-btn">Установить приложение</button>
  <div class="hint" id="gpu-warn" style="display:none;color:#f0883e">
    ⚠️ WebGPU не обнаружен — попробуйте Chrome/Edge на ПК или Android с включённым WebGPU.</div>
</div>

<header>
  <h1>🦞 CodeClaw</h1>
  <button id="install-btn-2" style="display:none;background:none;border:1px solid var(--border);color:var(--dim);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer;">Установить</button>
  <span id="status">загрузка…</span>
</header>

<div id="chat"></div>

<div id="composer">
  <textarea id="input" rows="1" placeholder="Опиши задачу или вставь код…"></textarea>
  <button id="send" disabled>➤</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.77/lib/index.min.js"></script>
<script src="app.js"></script>
</body>
</html>
